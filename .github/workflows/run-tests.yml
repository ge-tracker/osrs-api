name: Tests

on: [ push, pull_request ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        laravel: [ 9.*, 10.*, 11.*, 12.*, 13.* ]
        dto: [ ^2.0, ^3.0 ]
        include:
          - laravel: 9.*
            testbench: 7.*
            php: 8.1
          - laravel: 10.*
            testbench: 8.*
            php: 8.2
          - laravel: 11.*
            testbench: 9.*
            php: 8.2
          - laravel: 12.*
            testbench: 10.*
            php: 8.3
          - laravel: 13.*
            testbench: 11.*
            php: 8.3

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - DTO${{ matrix.dto }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none
          ini-values: post_max_size=8M, short_open_tag=Off

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-dto-${{ matrix.dto }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            dependencies-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-dto-${{ matrix.dto }}-composer-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "spatie/data-transfer-object:${{ matrix.dto }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-security-blocking

      - name: Execute tests
        run: vendor/bin/phpunit
